name: Validate Pokebot CFW bridge PR

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'sysmodules/rosalina/include/pokebot_bridge.h'
      - 'sysmodules/rosalina/source/pokebot_bridge*.c'
      - 'tools/pokebot_cfw_probe_v0p1.py'
      - '.github/workflows/build-pokebot-cfw.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pablomk7/libctrpf:0.8.0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build prerequisites
        run: |
          sed -i '/bullseye-backports/d' /etc/apt/sources.list 2>/dev/null || true
          if [ -d /etc/apt/sources.list.d ]; then
            grep -rl 'bullseye-backports' /etc/apt/sources.list.d 2>/dev/null | xargs -r sed -i '/bullseye-backports/d'
          fi
          apt-get update
          apt-get install -y python3-pip git build-essential
          python3 -m pip install git+https://github.com/TuxSH/firmtool.git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build makerom
        run: |
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/Project_CTR
          make -C /tmp/Project_CTR/makerom deps
          make -C /tmp/Project_CTR/makerom -j2
          install -m 0755 /tmp/Project_CTR/makerom/bin/makerom /usr/local/bin/makerom
          makerom -h >/dev/null 2>&1 || true

      - name: Build boot.firm
        run: make -j2

      - name: Upload boot.firm
        uses: actions/upload-artifact@v4
        with:
          name: Pokebot-CFW-v0p1-boot-firm
          path: boot.firm
