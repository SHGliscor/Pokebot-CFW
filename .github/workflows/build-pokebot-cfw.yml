# CI revision: v0p6 acknowledged touchscreen + latched HID experiment
name: Build Pokebot CFW Input Bridge v0p6 Latched HID

on:
  push:
    branches: [ pokebot-input-bridge-v0p5-touch ]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure toolchain environment
        run: |
          echo "/opt/devkitpro/devkitARM/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"
          echo "DEVKITPRO=/opt/devkitpro" >> "$GITHUB_ENV"
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> "$GITHUB_ENV"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Apply proven v0p4 idle-safe bridge transform
        run: |
          python3 tools/experimental/apply_v0p4_idle_safe.py
          grep -n "socPoll(&pfd, 1, 50)" sysmodules/rosalina/source/pokebot_bridge.c

      - name: Apply proven v0p5 acknowledged touchscreen transform
        run: |
          python3 tools/experimental/apply_v0p5_touch.py
          grep -n "CMD_INPUT_TOUCH_PULSE" sysmodules/rosalina/source/pokebot_bridge.c
          grep -n "INPUT_CAP_TOUCH_PULSE" sysmodules/rosalina/source/pokebot_bridge.c
          grep -n "PokebotInput_SetTouchState" sysmodules/rosalina/source/pokebot_bridge.c
          grep -n "PokebotInput_SetTouchState" sysmodules/rosalina/source/pokebot_input.c
          grep -n "touchState" sysmodules/rosalina/source/pokebot_input.c

      - name: Apply v0p6 latched HID transform
        run: |
          python3 tools/experimental/apply_v0p6_latched_hid.py
          grep -n "CMD_INPUT_HID_LATCH" sysmodules/rosalina/source/pokebot_bridge.c
          grep -n "INPUT_CAP_HID_LATCH" sysmodules/rosalina/source/pokebot_bridge.c
          grep -n "INPUT_RUNTIME_HID_LATCHED" sysmodules/rosalina/source/pokebot_bridge.c
          grep -n "INPUT_KIND_HID_LATCH" sysmodules/rosalina/source/pokebot_bridge.c
          grep -n "handleInputHidLatch" sysmodules/rosalina/source/pokebot_bridge.c
          git diff --check
          git diff -- sysmodules/rosalina/include/pokebot_input.h \
                      sysmodules/rosalina/source/pokebot_input.c \
                      sysmodules/rosalina/source/pokebot_bridge.c

      - name: Install host build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip git build-essential
          python3 -m pip install --no-cache-dir --break-system-packages git+https://github.com/TuxSH/firmtool.git

      - name: Install pinned makerom
        run: |
          rm -rf /tmp/Project_CTR
          git clone --depth 1 --branch makerom-v0.19.0 https://github.com/3DSGuy/Project_CTR.git /tmp/Project_CTR
          make -C /tmp/Project_CTR/makerom deps
          make -C /tmp/Project_CTR/makerom program
          install -m 0755 /tmp/Project_CTR/makerom/bin/makerom /usr/local/bin/makerom

      - name: Environment diagnostics
        run: |
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          command -v arm-none-eabi-gcc
          arm-none-eabi-gcc --version
          command -v makerom
          makerom -help >/dev/null 2>&1 || true
          command -v firmtool
          firmtool -v >/dev/null 2>&1 || true

      - name: Build boot.firm
        run: |
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make -j2

      - name: Verify boot.firm
        run: |
          test -s boot.firm
          ls -lh boot.firm
          sha256sum boot.firm

      - name: Upload boot.firm
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Pokebot-CFW-input-bridge-v0p6-latched-hid-boot-firm
          path: boot.firm
          if-no-files-found: error

      - name: Publish successful build locator
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          payload = {
              "state": "success",
              "context": "pokebot-v0p6-latched-hid-build",
              "description": f"run={os.environ['RUN_ID']} artifact={os.environ['ARTIFACT_ID']}",
              "target_url": os.environ["TARGET_URL"],
          }
          url = f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}"
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as response:
              print(response.status, response.read().decode("utf-8"))
          PY

      - name: Publish failed build locator
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          payload = {
              "state": "failure",
              "context": "pokebot-v0p6-latched-hid-build",
              "description": f"run={os.environ['RUN_ID']} build failed",
              "target_url": os.environ["TARGET_URL"],
          }
          url = f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}"
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as response:
              print(response.status, response.read().decode("utf-8"))
          PY
