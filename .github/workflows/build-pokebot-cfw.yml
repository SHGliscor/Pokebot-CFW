name: Build Pokebot CFW Input Bridge v0p2

on:
  push:
    branches: [ pokebot-input-bridge-v0p2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pablomk7/libctrpf:0.8.0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install firmtool
        run: |
          # libctrpf:0.8.0 is based on Debian Bullseye and still contains the
          # retired bullseye-backports repository. Remove only that obsolete
          # source before apt-get update; keep the DevkitPro/toolchain sources.
          sed -i '/bullseye-backports/d' /etc/apt/sources.list 2>/dev/null || true
          find /etc/apt/sources.list.d -maxdepth 1 -type f -exec sh -c '
            if grep -q "bullseye-backports" "$1"; then rm -f "$1"; fi
          ' _ {} \;
          apt-get update
          apt-get install -y --no-install-recommends python3-pip git
          python3 -m pip install --no-cache-dir git+https://github.com/TuxSH/firmtool.git

      - name: Verify toolchain
        run: |
          arm-none-eabi-gcc --version
          makerom -h >/dev/null
          firmtool -v >/dev/null 2>&1 || true

      - name: Build boot.firm
        run: make -j2

      - name: Upload boot.firm
        uses: actions/upload-artifact@v4
        with:
          name: Pokebot-CFW-input-bridge-v0p2-boot-firm
          path: boot.firm
