name: Build Pokebot CFW Input Bridge

on:
  push:
    branches: [ pokebot-input-bridge-v0p1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pablomk7/libctrpf:0.8.0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install firmtool
        run: |
          apt-get update
          apt-get install -y python3-pip git
          python3 -m pip install --break-system-packages git+https://github.com/TuxSH/firmtool.git

      - name: Verify toolchain
        run: |
          arm-none-eabi-gcc --version
          makerom -h >/dev/null
          firmtool -v >/dev/null 2>&1 || true

      - name: Build boot.firm
        run: make -j2

      - name: Upload boot.firm
        uses: actions/upload-artifact@v4
        with:
          name: Pokebot-CFW-input-bridge-v0p1-boot-firm
          path: boot.firm
